[package]
name = "fpl-optimizer"
version = "0.1.0"
edition = "2021"
authors = ["FPL Optimizer Team"]
description = "Fantasy Premier League squad optimization using Mixed Integer Linear Programming"
license = "MIT"
keywords = ["fpl", "fantasy-premier-league", "optimization", "milp", "linear-programming"]
categories = ["algorithms", "mathematics"]

[lib]
name = "fpl_optimizer"
path = "src/lib.rs"

[[bin]]
name = "fpl"
path = "src/main.rs"

[dependencies]
# Solver backend - using good_lp with default solver
good_lp = { version = "1.8", features = ["default"] }

# Serialization / Data Handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
toml = "0.8"

# CLI Interface
clap = { version = "4.4", features = ["derive"] }

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Random number generation
rand = "0.8"

[dev-dependencies]
tempfile = "3.9"

[profile.release]
lto = true
codegen-units = 1
